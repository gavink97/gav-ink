repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: "assets/converter.js"
      - id: check-added-large-files
  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.0
    hooks:
      - id: check-json5
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
      - id: no-go-testing
      - id: golangci-lint
      - id: go-unit-tests
      - id: go-mod-tidy
  - repo: local
    #      - id: validate-toml

    hooks:
      - id: local-templ-fmt
        name: templ fmt
        entry: templ fmt
        language: system
        types: [text]
        files: "\\.templ$"
      - id: local-biome-check
        name: biome check
        entry: npx biome check ./src
        language: system
        types: [text]
        files: "^src/.*\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|css)$"
      - id: local-vitest
        name: npx vitest
        entry: npx vitest run src --pass-with-no-tests
        language: node
        pass_filenames: false
        # if fails launch dev server first
    #- id: local-playwright-test
    #  name: npx playwright test
    #  entry: npx playwright test tests --reporter=list --pass-with-no-tests
    #  language: node
    #  pass_filenames: false
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.16.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
