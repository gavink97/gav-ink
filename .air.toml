root = "."
tmp_dir = ".tmp"

[build]
args_bin = []
bin = "./.tmp/gav-ink --airplane"
post_cmd = []
pre_cmd = ["templ generate", "make converter", "make build"]
cmd = "go build -o .tmp/gav-ink ./cmd/gav-ink"
delay = 1000
exclude_dir = [
    ".tmp",
    "node_modules",
    "tests",
    "bin",
    "build",
    "logs",
    "playwright-report",
    "test-results",
    "public",
    "images",
    "assets/modals",
    "dist",
    "backup model",
    "data"
]
exclude_file = [
    "assets/converter.js",
    "commitlint.config.js",
    "playwright.config.ts",
]
exclude_regex = [
    "_test.go",
    ".*_templ.go"
]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
include_dir = []
include_ext = [
    "go",
    "tpl",
    "tmpl",
    "templ",
    "html",
    "ts",
    "js",
    "css",
    "adoc",
    "rb",
    "glsl"
]
include_file = [
    "tokens.json"
]
kill_delay = 0
log = "build-errors.log"
poll = false
poll_interval = 0
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = false

[misc]
clean_on_exit = true

[proxy]
enabled = true
app_port = 8080
proxy_port = 3000

[screen]
clear_on_rebuild = true
keep_scroll = true
