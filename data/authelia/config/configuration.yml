# yamllint disable rule:comments-indentation
theme: 'light'
default_2fa_method: 'totp'
server:
  address: 0.0.0.0:9091
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'
log:
  level: 'debug'
  format: 'json'
totp:
  disable: false
  issuer: 'gav.ink'
ntp:
  address: 'udp://time.cloudflare.com:123'
authentication_backend:
  password_change:
    disable: true
  password_reset:
    disable: true
  file:
    path: '/config/users_database.yml'
    watch: false
    search:
      email: false
      case_insensitive: false
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16
      scrypt:
        variant: 'scrypt'
        iterations: 16
        block_size: 8
        parallelism: 1
        key_length: 32
        salt_length: 16
      pbkdf2:
        variant: 'sha512'
        iterations: 310000
        salt_length: 16
      sha2crypt:
        variant: 'sha512'
        iterations: 50000
        salt_length: 16
      bcrypt:
        variant: 'standard'
        cost: 12
password_policy:
  standard:
    enabled: true
    min_length: 20
    max_length: 0
    require_uppercase: true
    require_lowercase: true
    require_number: true
    require_special: true
access_control:
  default_policy: 'deny'
  rules:
    - domain:
        - 'gav.ink'
        - 'dev.gav.ink'
        - 'auth.gav.ink'
      policy: 'bypass'
    - domain:
        - 'dozzle.gav.ink'
        - 'traefik.gav.ink'
      policy: 'two_factor'
session:
  name: 'authelia_session'
  same_site: 'lax'
  inactivity: '5 minutes'
  expiration: '1 hour'
  remember_me: '1 week'
  cookies:
    - domain: 'gav.ink'
      name: 'authelia_session'
      authelia_url: 'https://auth.gav.ink'
      default_redirection_url: 'https://dozzle.gav.ink'
      same_site: 'lax'
      inactivity: '5 minutes'
      expiration: '1 hour'
      remember_me: '1 day'
regulation:
  modes:
    - 'user'
    - 'ip'
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '5 minutes'
storage:
  local:
    path: '/config/db.sqlite3'
notifier:
  disable_startup_check: true
  filesystem:
    filename: '/config/notification.txt'
